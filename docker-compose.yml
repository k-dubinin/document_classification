version: '3.8'

services:
  app:
    build: .
    container_name: document-classification-app
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./config:/app/config
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - PYTHONPATH=/app
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: ["streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]

  api:
    build: .
    container_name: document-classification-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./config:/app/config
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]