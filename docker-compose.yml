version: '3.8'

services:
  app:
    build: .
    container_name: document-classification-app
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./config:/app/config
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - PYTHONPATH=/app
    stdin_open: true
    tty: true
    restart: unless-stopped