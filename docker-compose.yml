version: '3.8'

services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./config:/app/config
      - ./data:/app/data
      - ./output:/app/output
      - ./input:/app/input
    stdin_open: true
    tty: true
    restart: unless-stopped
    container_name: document_classifier_ui

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./config:/app/config
      - ./data:/app/data
      - ./output:/app/output
      - ./input:/app/input
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    container_name: document_classifier_api